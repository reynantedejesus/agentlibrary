# /etc/nginx/conf.d/agentlibrary.conf
#
# Install and validate:
#   sudo install -m 0644 deploy/nginx-agentlibrary.conf /etc/nginx/conf.d/agentlibrary.conf
#   sudo nginx -t                     # syntax + config test
#   sudo systemctl reload nginx       # zero-downtime reload
#
# nginx must be able to reach the gunicorn socket:
#   sudo usermod -a -G agentlibrary nginx
#   sudo systemctl restart nginx

# Rate-limit zones. Applied per-location below; nginx sheds this load before it
# ever reaches Python, which is what you want during credential stuffing.
limit_req_zone $binary_remote_addr zone=agentlibrary_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=agentlibrary_api:10m   rate=60r/s;
limit_conn_zone $binary_remote_addr zone=agentlibrary_conn:10m;

# Gunicorn listens on loopback only (GUNICORN_BIND in
# /etc/agentlibrary/agentlibrary.env). To switch to a Unix socket, change the
# server line to `server unix:/run/agentlibrary/agentlibrary.sock
# fail_timeout=0;` and set GUNICORN_BIND to match.
upstream agentlibrary_app {
    server 127.0.0.1:8090 fail_timeout=0;
    keepalive 16;
}

# Map the forwarded scheme so the app builds correct absolute URLs.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https   https;
}

# -----------------------------------------------------------------------------
# HTTP :80
# Serves only the ACME challenge and redirects everything else to HTTPS.
# BEFORE TLS is configured, comment out the `return 301` and uncomment the
# `location / { proxy_pass ... }` block so the app is reachable during setup.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name agentlibrary.wingsglobaltravel.com;

    # Certbot's webroot challenge must stay reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    # Health checks from a local load balancer may not speak TLS.
    location = /health {
        access_log off;
        proxy_pass http://agentlibrary_app;
        proxy_set_header Host $host;
    }

    # --- ONCE TLS IS IN PLACE, this redirect is the whole point of :80 -------
    location / {
        return 301 https://$host$request_uri;
    }

    # --- BEFORE TLS: comment out the redirect above and use this instead -----
    # location / {
    #     proxy_pass http://agentlibrary_app;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Forwarded-Host  $host;
    # }
}

# -----------------------------------------------------------------------------
# HTTPS :443
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agentlibrary.wingsglobaltravel.com;

    # --- TLS -----------------------------------------------------------------
    # Organisation-issued certificate (preferred):
    #   /etc/pki/tls/certs/agentlibrary.crt   — leaf + intermediate chain
    #   /etc/pki/tls/private/agentlibrary.key — mode 0600, root:root
    # Certbot alternative: certbot --nginx -d agentlibrary.wingsglobaltravel.com
    # rewrites these two lines to point at /etc/letsencrypt/live/<domain>/.
    ssl_certificate     /etc/pki/tls/certs/agentlibrary.crt;
    ssl_certificate_key /etc/pki/tls/private/agentlibrary.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:AgentLibrarySSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling — needs a chain file and a resolver.
    ssl_stapling on;
    ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/pki/tls/certs/agentlibrary-chain.crt;
    # resolver 1.1.1.1 8.8.8.8 valid=300s;
    # resolver_timeout 5s;

    # --- security headers ----------------------------------------------------
    # The app sets these too; `always` makes them apply to error responses that
    # never reach Python (413, 502, 504).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Do not advertise the exact nginx version.
    server_tokens off;

    # --- request limits ------------------------------------------------------
    # MUST match Flask's MAX_CONTENT_LENGTH (26214400 bytes = 25 MiB). If this
    # is smaller, nginx rejects the upload with a bare HTML 413 that the SPA
    # cannot parse; if it is larger, the request is streamed all the way to
    # Python only to be refused there.
    client_max_body_size 25m;
    client_body_buffer_size 256k;
    client_body_timeout 60s;
    client_header_timeout 20s;
    send_timeout 60s;
    large_client_header_buffers 4 16k;
    limit_conn agentlibrary_conn 40;

    # --- logging -------------------------------------------------------------
    access_log /var/log/nginx/agentlibrary.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/agentlibrary.error.log warn;

    # --- static assets -------------------------------------------------------
    # Served straight from disk. This is the ONLY directory nginx exposes; the
    # upload store lives at /var/lib/agentlibrary/uploads and is deliberately
    # NOT mapped to any URL — every download goes through the authorised
    # /api/files/<id>/download endpoint so permissions are actually checked.
    location /static/ {
        alias /var/www/agentlibrary/static/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;

        # Never execute anything from the static tree.
        location ~* \.(php|py|pyc|sh|cgi|pl)$ { deny all; }
        # Do not serve editor leftovers or dotfiles.
        location ~ /\.            { deny all; }
        location ~ ~$             { deny all; }
        try_files $uri =404;
    }

    # Belt and braces: refuse any URL that even looks like the upload store or
    # the application's private files, whatever else is configured.
    location ~ ^/(uploads|var|instance|migrations|app|tests|\.env|\.git) {
        deny all;
        return 404;
    }

    # --- login: strict rate limit -------------------------------------------
    location = /api/auth/login {
        limit_req zone=agentlibrary_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/agentlibrary-proxy.inc;
    }

    location = /api/auth/change-password {
        limit_req zone=agentlibrary_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/agentlibrary-proxy.inc;
    }

    # --- file downloads: no buffering, long timeout --------------------------
    location ~ ^/api/files/\d+/download$ {
        include /etc/nginx/conf.d/agentlibrary-proxy.inc;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # --- uploads: stream to the app, do not buffer to disk first -------------
    location ~ ^/api/assets/\d+/files$ {
        include /etc/nginx/conf.d/agentlibrary-proxy.inc;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # --- health: no logging, no rate limit ----------------------------------
    location = /health {
        access_log off;
        include /etc/nginx/conf.d/agentlibrary-proxy.inc;
    }

    # --- API -----------------------------------------------------------------
    location /api/ {
        limit_req zone=agentlibrary_api burst=120 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/agentlibrary-proxy.inc;
    }

    # --- everything else (the SPA shell) -------------------------------------
    location / {
        include /etc/nginx/conf.d/agentlibrary-proxy.inc;
    }

    # Keep error pages plain; do not leak upstream details.
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
