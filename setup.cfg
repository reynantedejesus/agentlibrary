# flake8 cannot read pyproject.toml, so its configuration lives here.
#
#   .venv/bin/flake8 app tests wsgi.py gunicorn.conf.py

[flake8]
max-line-length = 100
max-complexity = 18
exclude =
    .git,
    __pycache__,
    .venv,
    migrations/versions,
    var,
    build,
    dist
per-file-ignores =
    # Blueprint modules import for side effects and re-export freely.
    app/__init__.py:E402
    # register_cli() is a container for independent click commands; its
    # branch count is the number of commands, not real complexity.
    app/cli.py:C901
    tests/*:E501
ignore =
    # Line break before binary operator — conflicts with W504.
    W503,
    # Whitespace before ':' — conflicts with black-style slicing.
    E203
