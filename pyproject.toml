# Packaging and tool configuration for the Agent Library.
#
# The application is deployed from a checkout rather than as an installed
# wheel, so this file exists mainly to configure pytest, coverage and flake8 in
# one place. `pip install -e .` still works if you prefer an editable install.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlibrary"
version = "1.1.0"
description = "Wings Global Travel — internal AI asset registry and catalogue"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }

# Runtime pins live in requirements.txt, which is what deployment installs.
# Keeping them loose here avoids two sources of truth fighting each other.
dependencies = [
    "Flask>=3.0,<4.0",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "Flask-Migrate>=4.0,<5.0",
    "Flask-WTF>=1.2,<2.0",
    "Flask-Limiter>=3.5,<4.0",
    "SQLAlchemy>=2.0,<3.0",
    "PyMySQL>=1.1,<2.0",
    "cryptography>=42",
    "gunicorn>=22",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "flake8>=7.0"]

[tool.setuptools]
packages = ["app", "app.api"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.flake8]
# flake8 does not read pyproject.toml natively; see setup.cfg.
max-line-length = 100
